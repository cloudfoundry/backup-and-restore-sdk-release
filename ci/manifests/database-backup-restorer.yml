---
name: ((deployment-name))

releases:
- name: backup-and-restore-sdk
  version: latest  # pinned to the uploaded dev release in CI

stemcells:
- alias: default
  os: ubuntu-resolute
  version: latest

instance_groups:
- name: database-backup-restorer
  instances: 1
  vm_type: default
  persistent_disk: 10240
  stemcell: default
  networks:
  - name: default
  jobs:
  - name: database-backup-restorer
    release: backup-and-restore-sdk
  azs: [z1]

update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 30000
  update_watch_time: 30000
