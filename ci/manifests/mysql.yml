---
name: ((deployment-name))

releases:
- name: pxc
  version: latest
  url: https://bosh.io/releases/github.com/cloudfoundry/pxc-release
- name: bpm
  version: latest
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release

# The mysql servers are a test fixture, not the code under test. They run on
# noble because cf-deployment only publishes compiled PXC and BPM for noble,
# and compiling PXC takes hours. The SDK itself is deployed on Resolute.
stemcells:
- alias: default
  os: ubuntu-noble
  version: latest

instance_groups:
- name: mysql
  instances: 1
  vm_type: default
  persistent_disk: 10240
  stemcell: default
  update:
    serial: true
  networks:
  - name: default
  jobs:
  - name: bpm
    release: bpm
  - name: cluster-health-logger
    release: pxc
    properties:
      db_password: foo
  - name: galera-agent
    release: pxc
    properties:
      db_password: foo
      endpoint_username: galera_healthcheck
      endpoint_password: foo
  - name: pxc-mysql
    release: pxc
    properties:
      mysql_version: "((mysql_version))"
      admin_password: ((db_password))
      port: 3306
      monit_startup_timeout: 120
      remote_admin_access: true
      tls:
        server:
          ca: ((databases.ca))
          certificate: ((databases.certificate))
          private_key: ((databases.private_key))
  azs: [((availability_zone))]

variables:
- name: databases_ca
  type: certificate
  options:
    is_ca: true
    common_name: mysql-ca
# The server's certificate, and the client certificate the mutual TLS tests
# use. It can't be a CA certificate itself: those only allow certificate
# signing, and TLS rejects them as "unsuitable certificate purpose".
- name: databases
  type: certificate
  options:
    ca: databases_ca
    common_name: mysql
    extended_key_usage: [server_auth, client_auth]

update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 30000
  update_watch_time: 30000
