---
# Applied to bosh-deployment's warden/cloud-config.yml by
# ci/tasks/shared/local-bosh.sh. Adds the vm and disk types the test
# manifests use, and makes room for their static IPs (10.244.0.7 for minio,
# 10.244.0.10-11 for mysql, 10.244.0.15-18 for postgres).
- type: replace
  path: /vm_types/name=small?
  value:
    name: small

- type: replace
  path: /disk_types/name=10GB?
  value:
    name: 10GB
    disk_size: 10240

- type: replace
  path: /networks/name=default/subnets/0/static
  value: [10.244.0.2-10.244.0.63]
