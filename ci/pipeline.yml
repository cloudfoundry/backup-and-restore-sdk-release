---
#! CFF Concourse (bosh.ci.cloudfoundry.org, team main). See MIGRATION-TO-CFF.md.
#!
#! Until cutover this pipeline only tests. The old pipeline on
#! ci.bosh-ecosystem.cf-app.com keeps cutting releases and bumping
#! dependencies, so no job here writes to git or to the release blobstore.

#! This var source only holds the YAML anchors used below; nothing reads it
#! as a var source. It's here, rather than in a top-level key of its own, so
#! that `fly validate-pipeline --strict` passes.
var_sources:
- name: anchors
  type: dummy
  config:
    vars:
      branch: &backup_and_restore_sdk_branch cff-migration

      aws-region: &aws-region eu-north-1
      aws-backup-region: &aws-backup-region eu-west-1
      number-of-test-retries: &number_of_test_retries 3

      #! AWS: CFF account 504405067906, created by ci/scripts/create-cff-iam.sh.
      #! The user's only permission is assuming role_arn.
      aws-access-key: &aws_access_key ((bbr_sdk_aws_creds.access_key_id))
      aws-secret-key: &aws_secret_key ((bbr_sdk_aws_creds.secret_access_key))
      aws-role-arn: &aws_role_arn ((bbr_sdk_aws_creds.role_arn))

      #! The IAM test's VM gets this instance profile, which can only reach
      #! the iam-instance-role-test buckets.
      iam-instance-profile: &iam_instance_profile ci-bbr-sdk-s3-backuper

      #! S3 buckets, created by ci/scripts/create-cff-s3-buckets.sh.
      #! Buckets aren't shared between tests.
      pipeline-bucket: &pipeline_bucket ci-bbr-sdk-pipeline
      s3-system-test-bucket: &s3_system_test_bucket ci-bbr-sdk-system-test
      s3-system-test-clone-bucket: &s3_system_test_clone_bucket ci-bbr-sdk-system-test-clone
      s3-system-test-unversioned-bucket: &s3_system_test_unversioned_bucket ci-bbr-sdk-system-test-unversioned
      s3-unversioned-bucket: &s3_unversioned_bucket ci-bbr-sdk-s3-unversioned
      s3-unversioned-backup-bucket: &s3_unversioned_backup_bucket ci-bbr-sdk-s3-unversioned-backup
      s3-unversioned-bpm-bucket: &s3_unversioned_bpm_bucket ci-bbr-sdk-unversioned-bpm
      s3-unversioned-bpm-backup-bucket: &s3_unversioned_bpm_backup_bucket ci-bbr-sdk-unversioned-bpm-backup
      s3-large-number-of-files-bucket: &s3_large_number_of_files_bucket ci-bbr-sdk-large-number-of-files
      s3-large-number-of-files-backup-bucket: &s3_large_number_of_files_backup_bucket ci-bbr-sdk-large-number-of-files-backup
      s3-unversioned-clone-bucket: &s3_unversioned_clone_bucket ci-bbr-sdk-unversioned-clone
      s3-iam-test-bucket: &s3_iam_test_bucket ci-bbr-sdk-iam-instance-role-test
      s3-iam-test-clone-bucket: &s3_iam_test_clone_bucket ci-bbr-sdk-iam-instance-role-test-clone

      #! S3 contract test fixtures, seeded by ci/scripts/seed-cff-fixtures.sh.
      #! Re-running the script prints these values again.
      s3-contract-test-fixtures: &S3_CONTRACT_TEST_FIXTURES
        S3_BIG_FILE_BUCKET: ci-bbr-sdk-large-blob-unversioned
        S3_BIG_FILE_SHA1: b4464dccad4fbfc9ccb8fc6e56e1f40463cd7514
        S3_VERSIONED_BIG_FILE_BUCKET: ci-bbr-sdk-large-blob
        S3_VERSIONED_BIG_FILE_REGION: *aws-region
        S3_VERSIONED_BIG_FILE_VERSION_ID: tC_VB4OU2K0v2J97xlzCzwx0z7ea9Wkv
        S3_VERSIONED_BIG_FILE_SHA1: b4464dccad4fbfc9ccb8fc6e56e1f40463cd7514
        S3_VERSIONED_BIG_BUCKET: ci-bbr-sdk-big-bucket
        S3_UNVERSIONED_BIG_BUCKET: ci-bbr-sdk-unversioned-big-bucket

      s3-aws: &S3_AWS
        S3_ACCESS_KEY_ID: *aws_access_key
        S3_SECRET_ACCESS_KEY: *aws_secret_key
        S3_ASSUMED_ROLE_ARN: *aws_role_arn
      aws-access: &AWS_ACCESS
        AWS_ACCESS_KEY_ID: *aws_access_key
        AWS_SECRET_ACCESS_KEY: *aws_secret_key
        AWS_ROLE_ARN: *aws_role_arn
        AWS_ASSUMED_ROLE_ARN: *aws_role_arn #! sdk-system-blobstore
      aws-deploy-vars: &aws_deploy_vars
        aws-access-key-id: *aws_access_key
        aws-secret-access-key: *aws_secret_key
        aws-assumed-role-arn: *aws_role_arn
      aws-credentials-s3: &aws_credentials_s3
        access_key_id: *aws_access_key
        secret_access_key: *aws_secret_key
        aws_role_arn: *aws_role_arn
      aws-credentials-tf: &aws_credentials_tf
        aws_access_key: *aws_access_key
        aws_secret_key: *aws_secret_key
        aws_assumed_role_arn: *aws_role_arn
      bbl-aws-params: &bbl_aws_params
        BBL_AWS_ACCESS_KEY_ID: *aws_access_key
        BBL_AWS_SECRET_ACCESS_KEY: *aws_secret_key
        BBL_AWS_ASSUME_ROLE: *aws_role_arn
        BBL_AWS_REGION: *aws-region

      #! Team-wide, to avoid Docker Hub rate limits.
      docker-username: &docker_username ((dockerhub_username))
      docker-password: &docker_password ((dockerhub_password))

      #! Team-wide; reads only, to avoid GitHub API rate limits.
      github-token: &github_token ((github_public_repo_token))

resource_types:
- name: terraform
  type: registry-image
  source:
    repository: ljfranklin/terraform-resource
    tag: 1.10.2
    username: *docker_username
    password: *docker_password

resources:
- name: backup-and-restore-sdk-release
  type: git
  icon: github
  source:
    uri: https://github.com/cloudfoundry/backup-and-restore-sdk-release.git
    branch: *backup_and_restore_sdk_branch
    ignore_paths: [ "ci" ]

- name: backup-and-restore-sdk-release-ci
  type: git
  icon: github
  source:
    uri: https://github.com/cloudfoundry/backup-and-restore-sdk-release.git
    branch: *backup_and_restore_sdk_branch
    paths: [ "ci" ]

- name: bosh-shared-ci
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-shared-ci.git

- name: bosh-integration-image
  type: registry-image
  source:
    repository: ghcr.io/cloudfoundry/bosh/integration
    tag: main

- name: warden-cpi-image
  type: registry-image
  source:
    repository: ghcr.io/cloudfoundry/bosh/warden-cpi
    tag: main

- name: bosh-ecosystem-docker-image
  type: registry-image
  source:
    repository: bosh/bosh-ecosystem-concourse
    username: *docker_username
    password: *docker_password

- name: bosh-cli-registry-image
  type: registry-image
  source:
    repository: bosh/cli
    username: *docker_username
    password: *docker_password

- name: cf-deployment-concourse-tasks-image
  type: registry-image
  source:
    repository: cloudfoundry/cf-deployment-concourse-tasks
    username: *docker_username
    password: *docker_password

- name: ruby-install
  type: github-release
  source:
    access_token: *github_token
    owner: postmodern
    repository: ruby-install
    tag_filter: \d+\.\d+\.\d+

- name: dev-release
  type: s3
  icon: database
  source:
    bucket: *pipeline_bucket
    versioned_file: dev-release.tgz
    region_name: *aws-region
    <<: *aws_credentials_s3

- name: jammy-stemcell
  type: bosh-io-stemcell
  icon: seed-outline
  source:
    name: bosh-warden-boshlite-ubuntu-jammy-go_agent

- name: jammy-stemcell-aws
  type: bosh-io-stemcell
  icon: seed-outline
  source:
    name: bosh-aws-xen-hvm-ubuntu-jammy-go_agent

- name: pxc-release
  type: bosh-io-release
  source:
    repository: cloudfoundry/pxc-release

- name: bpm-release
  type: bosh-io-release
  source:
    repository: cloudfoundry/bpm-release

- name: terraform
  type: terraform
  icon: terraform
  source:
    backend_type: s3
    backend_config:
      bucket: *pipeline_bucket
      key: terraform-rds-state
      region: *aws-region
      access_key: *aws_access_key
      secret_key: *aws_secret_key
      assume_role:
        role_arn: *aws_role_arn

jobs:
- name: unit-tests
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      trigger: true
    - get: bosh-integration-image
    - get: bosh-ecosystem-docker-image
    - get: ruby-install
  - in_parallel:
    - task: sdk-template-unit-tests
      image: bosh-ecosystem-docker-image
      file: backup-and-restore-sdk-release-ci/ci/tasks/sdk-template-unit-tests/task.yml
    - task: databases-unit-tests
      image: bosh-integration-image
      file: backup-and-restore-sdk-release-ci/ci/tasks/database-unit-tests/task.yml
      privileged: true
    - task: s3-blobstore-unit-tests
      image: bosh-integration-image
      file: backup-and-restore-sdk-release-ci/ci/tasks/sdk-unit-blobstore/task.yml
      params:
        PACKAGE_NAME: s3-blobstore-backup-restore
        GINKGO_EXTRA_FLAGS: -p --skip-package s3bucket
    - task: azure-blobstore-unit-tests
      image: bosh-integration-image
      file: backup-and-restore-sdk-release-ci/ci/tasks/sdk-unit-blobstore/task.yml
      params:
        PACKAGE_NAME: azure-blobstore-backup-restore
        GINKGO_EXTRA_FLAGS: -p --skip-package contract_test
    - task: gcs-blobstore-unit-tests
      image: bosh-integration-image
      file: backup-and-restore-sdk-release-ci/ci/tasks/sdk-unit-blobstore/task.yml
      params:
        PACKAGE_NAME: gcs-blobstore-backup-restore
        GINKGO_EXTRA_FLAGS: -p --skip-package contract_test

- name: contract-tests
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      trigger: true
      passed:
      - unit-tests
    - get: bosh-integration-image
  - in_parallel:
    - task: aws-s3-blobstore-contract-tests
      image: bosh-integration-image
      attempts: *number_of_test_retries
      file: backup-and-restore-sdk-release-ci/ci/tasks/sdk-unit-blobstore/task.yml
      params:
        PACKAGE_NAME: s3-blobstore-backup-restore/s3bucket
        S3_LIVE_REGION: *aws-region
        S3_BACKUP_REGION: *aws-backup-region
        S3_ENDPOINT: ""
        <<: [*S3_CONTRACT_TEST_FIXTURES, *S3_AWS]

- name: build-rc
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release
      passed: [contract-tests]
      trigger: true
    - get: bosh-shared-ci
    - get: bosh-cli-registry-image
  #! Reads the existing final release blobs anonymously; nothing is uploaded.
  - task: create-dev-release
    image: bosh-cli-registry-image
    file: bosh-shared-ci/tasks/release/create-dev-release.yml
    input_mapping:
      release_repo: backup-and-restore-sdk-release
  - put: dev-release
    params:
      file: release_tarball/release.tgz

- name: system-tests-postgres
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      passed: [build-rc]
    - get: dev-release
      trigger: true
      passed: [build-rc]
    - get: stemcell
      resource: jammy-stemcell
    - get: bpm-release
    - get: warden-cpi-image
  - task: system-tests-postgres
    image: warden-cpi-image
    privileged: true
    file: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-postgres/task.yml

- name: system-tests-mysql
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      passed: [build-rc]
    - get: dev-release
      trigger: true
      passed: [build-rc]
    - get: stemcell
      resource: jammy-stemcell
    - get: bpm-release
    - get: pxc-release
    - get: warden-cpi-image
  - task: system-tests-mysql
    image: warden-cpi-image
    privileged: true
    #! PXC compiles from source, twice.
    timeout: 3h
    file: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-mysql/task.yml

- name: system-tests-s3
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      passed: [build-rc]
    - get: dev-release
      trigger: true
      passed: [build-rc]
    - get: stemcell
      resource: jammy-stemcell
    - get: warden-cpi-image
  - task: system-tests-s3
    image: warden-cpi-image
    privileged: true
    file: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-blobstore/task.yml
    params:
      MANIFEST: s3-backuper.yml
      BOSH_DEPLOYMENT: s3-backuper
      DEPLOY_VARS:
        s3-bucket-name: *s3_system_test_bucket
        s3-region: *aws-region
        s3-cloned-bucket-name: *s3_system_test_clone_bucket
        s3-cloned-bucket-region: *aws-backup-region
        s3-unversioned-bucket-name-for-versioned-backuper: *s3_system_test_unversioned_bucket
        s3-unversioned-bucket-region-for-versioned-backuper: *aws-region
        s3-unversioned-bucket-name: *s3_unversioned_bucket
        s3-unversioned-bucket-region: *aws-region
        s3-unversioned-backup-bucket-name: *s3_unversioned_backup_bucket
        s3-unversioned-backup-bucket-region: *aws-backup-region
        s3-unversioned-bpm-bucket-name: *s3_unversioned_bpm_bucket
        s3-unversioned-bpm-bucket-region: *aws-region
        s3-unversioned-bpm-backup-bucket-name: *s3_unversioned_bpm_backup_bucket
        s3-unversioned-bpm-backup-bucket-region: *aws-region
        s3-unversioned-large-number-of-files-bucket-name: *s3_large_number_of_files_bucket
        s3-unversioned-large-number-of-files-bucket-region: *aws-region
        s3-unversioned-large-number-of-files-backup-bucket-name: *s3_large_number_of_files_backup_bucket
        s3-unversioned-large-number-of-files-backup-bucket-region: *aws-region
        s3-unversioned-clone-bucket-name: *s3_unversioned_clone_bucket
        s3-unversioned-clone-bucket-region: *aws-backup-region
        #! MinIO runs inside the deployment, so these never leave it.
        minio-access-key: minio-access-key
        minio-secret-key: minio-secret-key
        <<: *aws_deploy_vars
      TEST_SUITE_NAME: s3
      AWS_TEST_BUCKET_NAME: *s3_system_test_bucket
      AWS_TEST_BUCKET_REGION: *aws-region
      AWS_TEST_CLONE_BUCKET_NAME: *s3_system_test_clone_bucket
      AWS_TEST_CLONE_BUCKET_REGION: *aws-backup-region
      AWS_TEST_UNVERSIONED_BUCKET_NAME: *s3_system_test_unversioned_bucket
      AWS_TEST_UNVERSIONED_BUCKET_REGION: *aws-region
      S3_UNVERSIONED_BUCKET_NAME: *s3_unversioned_bucket
      S3_UNVERSIONED_BUCKET_REGION: *aws-region
      S3_UNVERSIONED_BACKUP_BUCKET_NAME: *s3_unversioned_backup_bucket
      S3_UNVERSIONED_BACKUP_BUCKET_REGION: *aws-backup-region
      S3_UNVERSIONED_BPM_BUCKET_NAME: *s3_unversioned_bpm_bucket
      S3_UNVERSIONED_BPM_BUCKET_REGION: *aws-region
      S3_UNVERSIONED_BPM_BACKUP_BUCKET_NAME: *s3_unversioned_bpm_backup_bucket
      S3_UNVERSIONED_BPM_BACKUP_BUCKET_REGION: *aws-region
      S3_UNVERSIONED_LARGE_NUMBER_OF_FILES_BUCKET_NAME: *s3_large_number_of_files_bucket
      S3_UNVERSIONED_LARGE_NUMBER_OF_FILES_BUCKET_REGION: *aws-region
      S3_UNVERSIONED_LARGE_NUMBER_OF_FILES_BACKUP_BUCKET_NAME: *s3_large_number_of_files_backup_bucket
      S3_UNVERSIONED_LARGE_NUMBER_OF_FILES_BACKUP_BUCKET_REGION: *aws-region
      S3_UNVERSIONED_CLONE_BUCKET_NAME: *s3_unversioned_clone_bucket
      S3_UNVERSIONED_CLONE_BUCKET_REGION: *aws-backup-region
      <<: *AWS_ACCESS

- name: system-tests-external-dbs-rds
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      passed: [build-rc]
    - get: dev-release
      trigger: true
      passed: [build-rc]
    - get: stemcell
      resource: jammy-stemcell
    - get: warden-cpi-image
  - put: terraform
    params:
      terraform_source: backup-and-restore-sdk-release-ci/ci/terraform/bbr-sdk-system-tests/aws/
      env_name: bbr-sdk-external-rds-dbs
      delete_on_failure: true
      vars:
        aws_region: *aws-region
        <<: *aws_credentials_tf
  - load_var: tf-outputs
    file: terraform/metadata
    format: json
  - task: system-tests-external-dbs-rds
    image: warden-cpi-image
    privileged: true
    file: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-external-dbs-rds/task.yml
    params:
      AWS_REGION: *aws-region
      RDS_SECURITY_GROUP_ID: ((.:tf-outputs.security_group_id))
      POSTGRES_15_HOST: ((.:tf-outputs.postgres_15_address))
      POSTGRES_15_PASSWORD: ((.:tf-outputs.postgres_15_password))
      POSTGRES_16_HOST: ((.:tf-outputs.postgres_16_address))
      POSTGRES_16_PASSWORD: ((.:tf-outputs.postgres_16_password))
      MARIADB_10_6_HOST: ((.:tf-outputs.mariadb_10_6_address))
      MARIADB_10_6_PASSWORD: ((.:tf-outputs.mariadb_10_password))
      <<: *AWS_ACCESS
  #! The instances are recreated on every run, rather than left running.
  ensure:
    put: terraform
    params:
      terraform_source: backup-and-restore-sdk-release-ci/ci/terraform/bbr-sdk-system-tests/aws/
      env_name: bbr-sdk-external-rds-dbs
      action: destroy
      vars:
        aws_region: *aws-region
        <<: *aws_credentials_tf
    get_params:
      action: destroy

- name: system-tests-s3-iam-instance-profile
  serial: true
  plan:
  - in_parallel:
    - get: backup-and-restore-sdk-release-ci
    - get: backup-and-restore-sdk-release
      passed: [build-rc]
    - get: dev-release
      trigger: true
      passed: [build-rc]
    - get: stemcell
      resource: jammy-stemcell-aws
    - get: bosh-integration-image
    - get: cf-deployment-concourse-tasks-image
  - task: bbl-up-aws
    image: cf-deployment-concourse-tasks-image
    file: backup-and-restore-sdk-release-ci/ci/tasks/bbl-up-aws/task.yml
    params:
      IAM_INSTANCE_PROFILE: *iam_instance_profile
      <<: *bbl_aws_params
  - task: extract-bbl-env
    image: cf-deployment-concourse-tasks-image
    file: backup-and-restore-sdk-release-ci/ci/tasks/extract-bbl-env/task.yml
    params: *bbl_aws_params
  - task: system-tests-s3-iam-instance-profile
    image: bosh-integration-image
    file: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-blobstore/task.yml
    params:
      MANIFEST: s3-backuper-with-iam-instance-profile.yml
      BOSH_DEPLOYMENT: s3-backuper
      DEPLOY_VARS:
        s3-bucket-name: *s3_iam_test_bucket
        s3-region: *aws-region
      TEST_SUITE_NAME: s3
      #! Only one spec: the rest of the suite is covered by system-tests-s3.
      FOCUS_SPEC: backs up and restores in-place
      AWS_TEST_BUCKET_NAME: *s3_iam_test_bucket
      AWS_TEST_BUCKET_REGION: *aws-region
      AWS_TEST_CLONE_BUCKET_NAME: *s3_iam_test_clone_bucket
      AWS_TEST_CLONE_BUCKET_REGION: *aws-region
      AWS_TEST_UNVERSIONED_BUCKET_NAME: *s3_system_test_unversioned_bucket
      AWS_TEST_UNVERSIONED_BUCKET_REGION: *aws-region
      <<: *AWS_ACCESS
  ensure:
    task: bbl-down-aws
    image: cf-deployment-concourse-tasks-image
    file: backup-and-restore-sdk-release-ci/ci/tasks/bbl-down-aws/task.yml
    params: *bbl_aws_params

- name: release-fan-in
  serial: true
  plan:
  - get: backup-and-restore-sdk-release
    trigger: true
    passed:
    - system-tests-postgres
    - system-tests-mysql
    - system-tests-s3
    - system-tests-s3-iam-instance-profile
    #! Add once it has been green several times (MIGRATION-TO-CFF.md, 2.4).
    #! - system-tests-external-dbs-rds
