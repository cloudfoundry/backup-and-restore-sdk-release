---
platform: linux

inputs:
- name: backup-and-restore-sdk-release-ci
- name: bbl-state

outputs:
# env.sh: exports BOSH_ENVIRONMENT, BOSH_CLIENT, BOSH_CLIENT_SECRET,
# BOSH_CA_CERT (a path) and BOSH_GW_HOST, BOSH_GW_USER and
# BOSH_GW_PRIVATE_KEY (the key itself).
- name: bosh-env

params:
  BBL_IAAS: aws
  BBL_AWS_ACCESS_KEY_ID:
  BBL_AWS_SECRET_ACCESS_KEY:
  BBL_AWS_ASSUME_ROLE:
  BBL_AWS_REGION:

run:
  path: backup-and-restore-sdk-release-ci/ci/tasks/extract-bbl-env/task.sh
