---
platform: linux

inputs:
- name: backup-and-restore-sdk-release
- name: backup-and-restore-sdk-release-ci
- name: dev-release
- name: bpm-release
- name: postgres-release
- name: stemcell

run:
  path: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-postgres/task.sh

params:
  POSTGRES_VERSIONS: "15 16 17 18"
  POSTGRES_USERNAME: test_user
  POSTGRES_PASSWORD: postgres_password
  POSTGRES_PORT: 5432
  SDK_DEPLOYMENT: database-backup-restorer
  SDK_INSTANCE_GROUP: database-backup-restorer
