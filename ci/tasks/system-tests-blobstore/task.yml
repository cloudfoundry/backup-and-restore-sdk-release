---
platform: linux

inputs:
- name: backup-and-restore-sdk-release
- name: backup-and-restore-sdk-release-ci
- name: dev-release
- name: stemcell
- name: bpm-release
  optional: true
- name: os-conf-release
  optional: true
# Can be from extract-bbl-env. Without it, the task starts a director in the
# container
- name: bosh-env
  optional: true

run:
  path: backup-and-restore-sdk-release-ci/ci/tasks/system-tests-blobstore/task.sh

params:
  MANIFEST:
  DEPLOY_VARS:
  BOSH_DEPLOYMENT:
  TEST_SUITE_NAME:
  FOCUS_SPEC:
  GCP_SERVICE_ACCOUNT_KEY:
